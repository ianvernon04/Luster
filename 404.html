<title>Luster</title>
<script>
  // Pretty booking links: /book/<studio> → /book/?s=<studio> (GitHub Pages serves this file for any unknown path)
  (function () {
    var parts = location.pathname.split('/'); var i = parts.indexOf('book');
    if (i >= 0 && parts[i + 1]) location.replace(parts.slice(0, i + 1).join('/') + '/?s=' + encodeURIComponent(decodeURIComponent(parts[i + 1]).toLowerCase()) + location.hash);
  })();
</script>
