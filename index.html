/* ---------- Controls ---------- */

.input, .select, .textarea {

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }

  display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface);
  min-height: 36px;
}
.search svg { width: 16px; height: 16px; color: var(--ink-3); flex: none; }
.search input { border: 0; background: transparent; flex: 1; min-width: 0; padding: 6px 0; outline: none; }
.search kbd { font-family: var(--font-ui); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; min-height: 28px; }

/* ---------- Calendar ---------- */

.cal-time { height: calc(var(--slot-h) * 4); font-size: 11px; color: var(--ink-3); text-align: right; padding-right: 8px; transform: translateY(-7px); font-variant-numeric: tabular-nums; }
.cal-col { position: relative; border-right: 1px solid var(--line-2); background: repeating-linear-gradient(to bottom, var(--line-2) 0 1px, transparent 1px calc(var(--slot-h) * 4)); }
.cal-col.off { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, transparent 6px 12px); }
.cal-col .off-band { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--surface-3) 0 5px, transparent 5px 11px); opacity: 0.8; pointer-events: none; }
.cal-slot { position: absolute; left: 0; right: 0; height: var(--slot-h); }
.cal-slot:hover { background: var(--accent-soft); opacity: 0.6; cursor: copy; }
.now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--bad); z-index: 2; pointer-events: none; }
.now-line::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.appt {
  position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 5px 8px 4px 10px; overflow: hidden; cursor: grab; user-select: none; -webkit-user-select: none;
  background: color-mix(in oklab, var(--cat) 14%, var(--surface)); border: 1px solid color-mix(in oklab, var(--cat) 35%, var(--surface)); color: var(--ink);
  font-size: 12px; line-height: 1.3; touch-action: none; z-index: 1; box-shadow: var(--shadow-1);
}
.appt::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--cat); }
.appt:hover { box-shadow: var(--shadow-2); z-index: 2; }
.appt.dragging { opacity: 0.85; box-shadow: var(--shadow-3); z-index: 5; cursor: grabbing; }
.appt .t { font-weight: 600; font-size: 12px; display: flex; gap: 6px; align-items: center; }
.appt .s { color: var(--ink-2); font-size: 11.5px; }
.appt .st { position: absolute; right: 6px; top: 5px; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--surface); }
.appt.short { padding-top: 2px; }
.appt.short .s { display: none; }
.appt.short .t { font-size: 11.5px; }
.appt.micro { padding: 0 6px 0 9px; line-height: 1.05; display: flex; align-items: center; }
.appt.micro .t { font-size: 10.5px; }
.appt.micro .st { top: 2px; }
.appt.status-completed { opacity: 0.62; }
.appt.status-cancelled, .appt.status-noshow { opacity: 0.5; text-decoration: line-through; }
.appt.status-inservice { border-style: solid; border-color: var(--cat); }
.appt.status-checkedin .t::after { content: "·  arrived"; color: var(--good-ink); font-weight: 500; }
.appt.status-inservice .t::after { content: "·  in room"; color: var(--accent); font-weight: 500; }
.st.booked { background: var(--ink-3); } .st.confirmed { background: var(--accent); } .st.checkedin { background: var(--good); } .st.inservice { background: var(--accent); } .st.completed { background: var(--ink-3); } .st.noshow { background: var(--bad); } .st.cancelled { background: var(--bad); }
.week-appt { font-size: 11px; padding: 3px 6px 3px 8px; }
.week-appt .s { display: none; }
.cal-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); padding: 8px 18px; border-top: 1px solid var(--line-2); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.agenda { display: flex; flex-direction: column; gap: 8px; }
.agenda-item { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2); border-left: 4px solid var(--cat); }

/* ---------- Drawer / Modal / Toast / Palette ---------- */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--drawer-w), 100vw); background: var(--surface); box-shadow: var(--shadow-3);
  transform: translateX(104%); transition: transform .22s cubic-bezier(.2,.8,.2,1); z-index: 40; display: flex; flex-direction: column; border-left: 1px solid var(--line-2);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer.open { transform: translateX(0); }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-2); }
.drawer-head h2 { font-size: 17px; font-weight: 600; flex: 1; min-width: 0; }
.drawer-body { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.drawer-foot { padding: 12px 16px; border-top: 1px solid var(--line-2); display: flex; gap: 8px; flex-wrap: wrap; background: var(--surface); }
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .15s ease; }
.modal { background: var(--surface); border-radius: var(--r-lg); width: min(560px, 100%); max-height: min(92vh, 100%); overflow: auto; box-shadow: var(--shadow-3); display: flex; flex-direction: column; animation: rise .18s cubic-bezier(.2,.8,.2,1); }
.modal.wide { width: min(820px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.modal-head h2 { font-size: 18px; font-weight: 600; flex: 1; }
.modal-body { padding: 6px 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line-2); }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { transform: translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }
.toasts { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 70; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: var(--r-md); box-shadow: var(--shadow-2); display: flex; align-items: center; gap: 10px; font-size: 13.5px; animation: rise .18s ease; pointer-events: auto; }
.toast.good::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.toast.bad::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
.toast .btn { margin-left: auto; color: var(--surface); border-color: transparent; background: rgba(255,255,255,0.12); }
.install-hint { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 65; width: min(520px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-3); padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; animation: rise .22s ease; }
.install-hint-text { flex: 1; min-width: 0; line-height: 1.35; }
.install-hint-text .ic { width: 16px; height: 16px; vertical-align: -3px; color: var(--accent); }
.install-hint .btn.ghost { padding: 4px; min-height: 28px; }
.install-hint .btn.ghost .ic { width: 16px; height: 16px; }
@media (max-width: 860px) { .install-hint { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); } }
.palette { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: min(12vh, 110px) 16px 16px; animation: fade .12s ease; }
.palette-box { width: min(620px, 100%); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-3); overflow: hidden; animation: rise .16s ease; }
.palette-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-2); }
.palette-input svg { width: 18px; height: 18px; color: var(--ink-3); }
.palette-input input { flex: 1; border: 0; background: transparent; font-size: 16px; outline: none; min-width: 0; }
.palette-list { max-height: 50vh; overflow: auto; padding: 6px; }
.palette-group { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px 4px; font-weight: 600; }
.palette-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; }
.palette-item.on, .palette-item:hover { background: var(--surface-2); }
.palette-item .k { margin-left: auto; font-size: 11px; color: var(--ink-3); }
.palette-item svg { width: 16px; height: 16px; color: var(--ink-3); }

/* ---------- Clients ---------- */
.clients-layout { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 0; height: 100%; }
.clients-list { border-right: 1px solid var(--line-2); display: flex; flex-direction: column; min-height: 0; }
.clients-list .list-tools { padding: 12px 14px 8px; display: flex; flex-direction: column; gap: 8px; }
.clients-list .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.clients-scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 8px 12px; }
.client-row { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: var(--r-sm); cursor: pointer; }
.client-row:hover { background: var(--surface-2); }
.client-row.on { background: var(--accent-soft); }
.client-row .nm { font-weight: 600; font-size: 13.5px; }
.client-row .mt { font-size: 12px; color: var(--ink-3); }
.client-detail { min-width: 0; overflow: auto; padding: 18px 20px 28px; }
.client-hero { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.client-hero h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; letter-spacing: -0.01em; line-height: 1.05; }
.client-hero .contact { color: var(--ink-2); font-size: 13px; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.client-hero .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; margin: 16px 0; }
.timeline { display: flex; flex-direction: column; gap: 0; position: relative; }
.tl-item { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
.tl-item:last-child { border-bottom: 0; }
.tl-date { font-size: 12.5px; color: var(--ink-3); line-height: 1.3; padding-top: 2px; }
.tl-date b { display: block; color: var(--ink); font-weight: 600; }
.tl-body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.tl-title { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
.note { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13px; line-height: 1.5; border-left: 3px solid var(--line); }
.note .by { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
.note.plan { border-left-color: var(--accent); }
.note.caution { border-left-color: var(--warn); background: var(--warn-soft); }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.photo { position: relative; aspect-ratio: 3 / 4; border-radius: var(--r-md); overflow: hidden; background: var(--surface-3); cursor: pointer; max-width: 100%; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .ph { position: absolute; inset: 0; }
.photo .tag { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: rgba(27,34,36,0.72); color: #fff; }
.photo .when { position: absolute; left: 8px; right: 8px; bottom: 8px; font-size: 11.5px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); display: flex; justify-content: space-between; }
.photo.add { display: grid; place-items: center; border: 1px dashed var(--line); background: transparent; color: var(--ink-3); font-size: 13px; }
.photo.add:hover { background: var(--surface-2); color: var(--ink); }
.compare { position: relative; aspect-ratio: 3 / 2; border-radius: var(--r-md); overflow: hidden; background: var(--surface-3); max-width: 100%; }
.compare .side { position: absolute; inset: 0; }
.compare .side.after { clip-path: inset(0 0 0 var(--cut, 50%)); }
.compare .handle { position: absolute; top: 0; bottom: 0; left: var(--cut, 50%); width: 2px; background: #fff; transform: translateX(-1px); box-shadow: 0 0 0 1px rgba(0,0,0,0.2); pointer-events: none; }
.compare .handle::after { content: "◂ ▸"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; color: #1B2224; font-size: 11px; padding: 4px 6px; border-radius: 999px; white-space: nowrap; }
.compare input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: ew-resize; }
.compare .lbl { position: absolute; top: 10px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgba(27,34,36,0.72); color: #fff; }
.compare .lbl.l { left: 10px; } .compare .lbl.r { right: 10px; }
.form-status { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--r-sm); }

/* ---------- Checkout ---------- */
.checkout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.ticket { position: sticky; top: 0; }
.ticket-lines { display: flex; flex-direction: column; }
.ticket-line { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line-2); align-items: center; }
.ticket-line .nm { font-weight: 500; }
.ticket-line .mt { font-size: 12px; color: var(--ink-3); }
.ticket-line .amt { font-variant-numeric: tabular-nums; font-weight: 500; }
.ticket-line .rm { border: 0; background: transparent; color: var(--ink-3); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
.ticket-line .rm:hover { background: var(--bad-soft); color: var(--bad-ink); }
.totals { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; }
.totals .tr { display: flex; justify-content: space-between; font-size: 13.5px; }
.totals .tr.big { font-size: 20px; font-weight: 600; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
.tips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pay-methods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.pay-method { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); text-align: left; }
.pay-method:hover { background: var(--surface-2); }
.pay-method b { font-size: 13.5px; }
.pay-method span { font-size: 11.5px; color: var(--ink-3); }
.catalog { display: flex; flex-direction: column; gap: 14px; }
.catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.cat-item { text-align: left; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--surface); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cat-item:hover { background: var(--surface-2); border-color: var(--line); }
.cat-item b { font-size: 13px; font-weight: 600; }
.cat-item span { font-size: 12px; color: var(--ink-3); }
.open-appts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.open-appt { text-align: left; display: flex; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--surface); }
.open-appt:hover { background: var(--surface-2); }
.terminal { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px 12px; text-align: center; }
.terminal .card-anim { width: 120px; height: 76px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); position: relative; animation: tap 1.4s ease-in-out infinite; }
.terminal .card-anim::after { content: ""; position: absolute; left: 12px; top: 22px; width: 28px; height: 20px; border-radius: 4px; background: rgba(255,255,255,0.7); }
@keyframes tap { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
.receipt { font-family: var(--font-ui); background: var(--surface-2); border-radius: var(--r-md); padding: 16px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.receipt .hd { text-align: center; font-family: var(--font-display); font-size: 22px; }
.receipt .ln { display: flex; justify-content: space-between; gap: 10px; }
.receipt .dash { border-top: 1px dashed var(--line); margin: 6px 0; }

/* ---------- Booking (client-facing preview) ---------- */
.booking-frame { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.booking-hero { text-align: center; padding: 10px 0 0; }
.booking-hero h2 { font-family: var(--font-display); font-weight: 400; font-size: 32px; letter-spacing: -0.01em; }
.booking-hero p { color: var(--ink-2); }
.steps { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.step { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); }
.step.on { color: var(--accent-strong); background: var(--accent-soft); font-weight: 600; }
.step.done { color: var(--good-ink); }
.svc-group h3 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 14px 0 8px; }
.svc-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--surface); text-align: left; width: 100%; }
.svc-row:hover { background: var(--surface-2); border-color: var(--line); }
.svc-row .d { color: var(--ink-2); font-size: 12.5px; }
.svc-row .p { margin-left: auto; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.svc-row.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.staff-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.staff-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 12px; border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--surface); text-align: center; }
.staff-card:hover { background: var(--surface-2); }
.staff-card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.staff-card .role { font-size: 12px; color: var(--ink-3); }
.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.day { flex: none; width: 64px; padding: 8px 4px; border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--surface); text-align: center; }
.day .dw { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.day .dn { font-family: var(--font-display); font-size: 22px; line-height: 1.1; }
.day.on { border-color: var(--accent); background: var(--accent-soft); }
.day[disabled] { opacity: 0.4; cursor: not-allowed; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.slot { padding: 9px 6px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; font-weight: 500; }
.slot:hover { background: var(--surface-2); }
.slot.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.summary { display: flex; flex-direction: column; gap: 8px; }
.summary .ln { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.confirm-tick { width: 64px; height: 64px; border-radius: 50%; background: var(--good-soft); color: var(--good-ink); display: grid; place-items: center; margin: 0 auto; }
.confirm-tick svg { width: 30px; height: 30px; }

/* ---------- Forms ---------- */
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-field > label { font-weight: 500; }
.form-field .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.form-field .opt { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.form-field .opt.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.sig-pad { border: 1px dashed var(--line); border-radius: var(--r-sm); background: var(--surface-2); touch-action: none; display: block; width: 100%; height: 140px; }
.consent-text { font-size: 13px; color: var(--ink-2); line-height: 1.55; max-height: 180px; overflow: auto; padding: 10px 12px; background: var(--surface-2); border-radius: var(--r-sm); }

.form-section { padding: 14px 0 2px; border-top: 1px solid var(--line-2); }
.form-section:first-child { border-top: 0; padding-top: 0; }
.form-section h3 { font-family: var(--font-display); font-weight: 400; font-size: 21px; letter-spacing: -0.01em; }
.form-section p { margin-top: 2px; }
.form-field.cond-on { padding-left: 12px; border-left: 3px solid var(--accent-soft); }
.form-field.ro label { font-size: 12px; color: var(--ink-3); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

/* ---------- Messages ---------- */
.msg-layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
.msg { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; padding: 10px 6px; border-bottom: 1px solid var(--line-2); align-items: start; }
.msg .body { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.msg .when { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function on(root, type, selector, fn) {
  root.addEventListener(type, (e) => { const el = e.target.closest(selector); if (el && root.contains(el)) fn(e, el); });
}
function formValues(form) {
  const o = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') { if (el.name.endsWith('[]')) { (o[el.name.slice(0, -2)] ||= []); if (el.checked) o[el.name.slice(0, -2)].push(el.value); } else o[el.name] = el.checked; }
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value;
  }
  return o;
}

const csvCell = (v) => { if (v == null) return ''; if (typeof v === 'number') return String(v); let s = String(v); if (/^[=+\-@\t\r]/.test(s)) s = `'${s}`; return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };   // a name can't smuggle in a spreadsheet formula
function toCsv(rows) { return '\ufeff' + rows.map((r) => r.map(csvCell).join(',')).join('\r\n'); }
async function saveFile(name, data, type = 'application/octet-stream') {
  const blob = data instanceof Blob ? data : new Blob([data], { type: `${type};charset=utf-8` });
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches && navigator.canShare) {
    try { const file = new File([blob], name, { type: blob.type || type }); if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; } }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

    consents: [
      consent('peel', 'Chemical Peel Consent', 'A chemical peel applies an acid solution to exfoliate the outer layers of skin. Expected effects include redness, tightness, sensitivity and visible flaking for 3–7 days. Rare effects include prolonged redness, hyperpigmentation, blistering or infection. Risks increase with recent retinoid or Accutane use, sun exposure, and picking at peeling skin.', ['I understand I may experience redness, tightness and flaking for 3–7 days.', 'I will avoid retinoids, exfoliants and direct sun for 7 days and wear SPF daily.', 'I have disclosed all medications, including any Accutane use in the last 12 months.']),
      consent('dermaplaning', 'Dermaplaning Consent', 'Dermaplaning uses a sterile, single-use blade to exfoliate the outermost layer of dead skin and remove vellus hair (peach fuzz). Expect mild redness and sensitivity for a few hours, and occasionally a small nick. Rare effects include breakouts, whiteheads, irritation or dark marks if the skin is exposed to sun afterward. Hair does not grow back thicker or darker. Not performed on active acne or open lesions, during a cold-sore outbreak, on sunburned skin, within 6 months of Accutane, or within 5 days of retinoid use.', ['I understand I may have mild redness and sensitivity for up to 24 hours, and that small nicks can occur.', 'I have not used Accutane in the last 6 months, have paused retinoids for 5 days, and have no active breakouts, cold sores or open skin in the treatment area.', 'I will avoid sun, heat, sweating, exfoliants and makeup for 24 hours and wear SPF daily afterward.']),
      consent('microneedling', 'Microneedling & Microchanneling Consent', 'Microneedling and microchanneling use fine, sterile needles to make thousands of tiny channels in the skin. That sets off the skin\'s own repair (new collagen and elastin) and lets serums absorb deeper. Expect redness, warmth and tightness for 24–48 hours, like a mild sunburn, and sometimes pinpoint bleeding or light flaking. Rare effects include bruising, breakouts, infection, a cold-sore flare-up and changes in pigment. It isn\'t done during pregnancy, within 6 months of Accutane, on keloid-prone skin, or over active acne, cold sores, sunburn or broken skin.', ['I understand I may be red, warm and tight for 24–48 hours, and that pinpoint bleeding, bruising or a breakout can happen.', 'I am not pregnant, have not taken Accutane in the last 6 months, and have no active breakouts, cold sores, sunburn or broken skin in the treatment area.', 'For 24 hours I will skip makeup, workouts, sun and actives (retinol, acids), and I will wear SPF every day afterward.']),

function seedTpl(cat) {

function generateClients(rng, cat) {
  const T = seedTpl(cat); const clients = []; const used = new Set(); const today = todayStr();
  const firsts = T.clientFirst || FIRST; const cf = T.clientFields;
  for (let i = 0; i < 420; i++) {
    let first, last, key;
    do { first = pick(rng, firsts); last = pick(rng, LAST); key = first + last; } while (used.has(key));
    used.add(key);

    const createdDaysAgo = chance(rng, 0.1) ? rint(rng, 1, 45) : rint(rng, 60, 760);
    const skin = pick(rng, cf.typeOptions);
    const concerns = uniq([pick(rng, cf.concernOptions), chance(rng, 0.6) ? pick(rng, cf.concernOptions) : null, chance(rng, 0.25) ? pick(rng, cf.concernOptions) : null].filter(Boolean));
    const allergies = chance(rng, 0.14) ? [pick(rng, T.allergyPool)] : [];

    const medical = seedMedical(rng, flags, allergies, T);

    const member = chance(rng, 0.24) ? cat.plans[pick(rng, planMix)].id : null;
    const memberSince = member ? addDays(today, -rint(rng, 20, Math.max(21, createdDaysAgo - 10))) : null;

    });

}

async function photoUrl(photo) {

function contraindications(c, serviceIds) {

    if (!c.flags.includes(rule.flag)) continue;
    const hit = serviceIds.map((id) => svcById(id)).filter((s) => s && (rule.services.includes(s.id) || rule.cats.includes(s.cat)));

function searchClients(q, limit = 50) {
  const s = q.trim().toLowerCase(); const all = st().clients;
  if (!s) return all.slice().sort(by((c) => c.last + c.first)).slice(0, limit);
  const digits = s.replace(/\D/g, '');
  const scored = [];
  for (const c of all) {
    const name = `${c.first} ${c.last}`.toLowerCase(); let score = 0;
    if (name.startsWith(s)) score = 3; else if (c.last.toLowerCase().startsWith(s) || c.first.toLowerCase().startsWith(s)) score = 2.5; else if (name.includes(s)) score = 2;

function downscaleImage(file, max) {
  return new Promise((res) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => res(b || file), 'image/jpeg', 0.86);
    };

    img.src = url;

/* Seeded appointments for today follow the clock until someone touches them. */
function refreshTodayStatuses() {
  const today = todayStr(), now = nowMin(); let changed = false;
  for (const a of st().appointments) {
    if (!a.seeded || a.touched || a.date !== today || a.status === 'cancelled' || a.status === 'noshow') continue;
    let s = a.status;
    if (a.start + a.dur <= now) s = 'completed'; else if (a.start <= now) s = 'inservice'; else if (a.start - 20 <= now) s = 'checkedin'; else if (s === 'completed' || s === 'inservice' || s === 'checkedin') s = 'confirmed';
    if (s !== a.status) { a.status = s; changed = true; }
    if (s === 'completed' && !a.ticketId) { makeSeededTicket(a); changed = true; }
  }

function makeSeededTicket(a) {
  const rng = mulberry32(parseInt(a.id.replace(/\D/g, ''), 10) || 1);

/* ===== Cloud: live businesses on Supabase =====
   A demo workspace never touches the network. A live workspace mirrors one real business in the cloud:
   - the iPad keeps a full local copy, so the calendar is instant and works offline;
   - local edits are pushed by diffing each record against what the cloud last confirmed (no edit can be missed);
   - cloud changes (online bookings, other devices) arrive by realtime, with a polling fallback;
   - the database refuses double-bookings, and a refused edit is rolled back on screen with an explanation.
   In the cloud for now: business, team, hours, services, clients (contact, profile, caution flags), appointments.
   Still on this device only: health answers, notes, photos, forms, tickets — the next release moves them. */

const ymd = (d) => (d ? String(d).slice(0, 10) : null);   // the cloud's plain dates, whatever shape they arrive in
const newUuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = (crypto.getRandomValues(new Uint8Array(1))[0] & 15); return (c === 'x' ? r : (r & 3) | 8).toString(16); }));

function hashOf(obj) { const s = JSON.stringify(obj); let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); }

/* ===== Remote support: problems on a live studio's iPad reach Luster support ===== */
// Script errors and sync problems are sent (scrubbed of emails and phone numbers, the same problem once per 10
// minutes, at most 30 a session) to app_events, so a problem in Baton Rouge can be seen and fixed from anywhere.
const Diag = {
  seen: new Map(), left: 30,
  build() { const m = document.querySelector('meta[name="luster-build"]'); return m ? m.content.split(' ')[0] : 'dev'; },
  device() { let standalone = false; try { standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) {} return `${navigator.userAgent.slice(0, 170)}${standalone ? ' · installed' : ''}`; },
  scrub(s) { return String(s == null ? '' : s).replace(/[^\s@<>"']+@[^\s@<>"']+\.[a-z]{2,}/gi, '[email]').replace(/(^|\D)((\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4})(?!\d)/g, '$1[phone]'); },   // no lookbehind: older iPads can't parse it
  report(kind, message, detail = {}) {
    try {
      if (!isLive() || !Cloud.user || this.left <= 0) return false;
      const msg = this.scrub(message).slice(0, 500); const key = `${kind}|${msg}`; const now = Date.now();
      if (this.seen.has(key) && now - this.seen.get(key) < 10 * 60000) return false;
      this.seen.set(key, now); this.left--;
      const d = {}; for (const [k, v] of Object.entries(detail || {})) d[k] = typeof v === 'string' ? this.scrub(v).slice(0, 1500) : v;
      Cloud.sb().rpc('log_app_event', { p_business: st().live.businessId, p_kind: kind, p_message: msg, p_detail: { ...d, view: S.ui && S.ui.view, online: navigator.onLine },
        p_device: this.device(), p_build: this.build() }).then(() => {}, () => {});
      return true;
    } catch (e) { return false; }
  },
};
window.addEventListener('error', (e) => { if (!e || !e.message) return; Diag.report('error', e.message, { at: `${String(e.filename || '').split('/').pop()}:${e.lineno}:${e.colno}`, stack: e.error && e.error.stack ? String(e.error.stack) : '' }); });
window.addEventListener('unhandledrejection', (e) => { const r = (e && e.reason) || {}; Diag.report('error', `Unhandled: ${r.message || String(r)}`, { stack: r.stack ? String(r.stack) : '' }); });

  const el = h(`<div class="toast ${kind}"><span>${msg}</span>${action ? `<button class="btn sm" data-act="${action.act}" ${action.attrs || ''}>${action.label}</button>` : ''}</div>`);
  $('#toasts').appendChild(el); setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, action ? 6000 : 3200);
}

function openPalette() { S.ui.palette = true; renderPalette(''); setTimeout(() => $('#palette-q')?.focus(), 10); }
function closePalette() { S.ui.palette = false; $('#palette-root').innerHTML = ''; }
function paletteResults(q) {
  const s = q.trim().toLowerCase(); const out = [];
  const actions = [
    { label: 'New appointment', hint: 'N', act: 'new-appt', icon: 'plus' }, { label: 'New client', act: 'new-client', icon: 'user' }, { label: 'Import clients from a CSV', act: 'import-open', icon: 'dl' }, { label: 'Open checkout', act: 'go', attrs: 'data-view="checkout"', icon: 'checkout' },

  ];
  const clients = s ? searchClients(s, 7) : st().clients.filter((c) => apptsOn(todayStr()).some((a) => a.clientId === c.id)).slice(0, 5);
  if (clients.length) out.push({ group: s ? 'Clients' : 'On the books today', items: clients.map((c) => ({ label: fullName(c), hint: fmtPhone(c.phone), act: 'open-client', attrs: `data-id="${c.id}"`, avatar: c })) });
  const acts = actions.filter((a) => !s || a.label.toLowerCase().includes(s));

  if (views.length) out.push({ group: 'Pages', items: views });

}
function renderPalette(q) {
  const groups = paletteResults(q); let idx = 0;
  $('#palette-root').innerHTML = `<div class="palette" data-act="palette-scrim"><div class="palette-box" role="dialog"><div class="palette-input">${I.search}<input id="palette-q" placeholder="Search clients, or type a command…" value="${esc(q)}" autocomplete="off"><kbd class="tiny faint">esc</kbd></div><div class="palette-list" id="palette-list">${groups.map((g) => `<div class="palette-group">${g.group}</div>${g.items.map((it) => `<div class="palette-item ${idx++ === 0 ? 'on' : ''}" data-act="${it.act}" ${it.attrs || ''} data-palette-item>${it.avatar ? `<div class="avatar sm" style="${avatarStyle(fullName(it.avatar))}">${initials(fullName(it.avatar))}</div>` : (it.icon ? I[it.icon] : '')}<span>${esc(it.label)}</span>${it.hint ? `<span class="k">${esc(it.hint)}</span>` : ''}</div>`).join('')}`).join('') || '<div class="palette-group">No matches</div>'}</div></div></div>`;
  const input = $('#palette-q');
  input.addEventListener('input', () => { const v = input.value; const list = $('#palette-list'); const gs = paletteResults(v); let i = 0; list.innerHTML = gs.map((g) => `<div class="palette-group">${g.group}</div>${g.items.map((it) => `<div class="palette-item ${i++ === 0 ? 'on' : ''}" data-act="${it.act}" ${it.attrs || ''} data-palette-item>${it.avatar ? `<div class="avatar sm" style="${avatarStyle(fullName(it.avatar))}">${initials(fullName(it.avatar))}</div>` : (it.icon ? I[it.icon] : '')}<span>${esc(it.label)}</span>${it.hint ? `<span class="k">${esc(it.hint)}</span>` : ''}</div>`).join('')}`).join('') || '<div class="palette-group">No matches</div>'; });
  input.addEventListener('keydown', (e) => {
    const items = $$('[data-palette-item]'); const cur = items.findIndex((x) => x.classList.contains('on'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = clamp(cur + (e.key === 'ArrowDown' ? 1 : -1), 0, items.length - 1); items.forEach((x) => x.classList.remove('on')); items[n]?.classList.add('on'); items[n]?.scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'Enter') { e.preventDefault(); const it = items[cur] || items[0]; if (it) { closePalette(); runAction(it); } }
  });
}

});

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A') return;
  runAction(el, e);
});
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase(); const typing = ['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); S.ui.palette ? closePalette() : openPalette(); return; }
  if (e.key === 'Escape') { if (S.ui.palette) return closePalette(); if (S.ui.modal) return closeModal(); if (S.ui.drawer) return closeDrawer(); }
  if (typing || S.ui.palette || S.ui.modal) return;
  if (e.key === '/') { e.preventDefault(); openPalette(); }
  else if (e.key.toLowerCase() === 'n') Actions['new-appt']?.();
  else if (e.key.toLowerCase() === 't') Actions['cal-today']?.();
  else if (e.key === 'ArrowLeft' && S.ui.view === 'calendar') Actions['cal-prev']?.();
  else if (e.key === 'ArrowRight' && S.ui.view === 'calendar') Actions['cal-next']?.();
});

/* ---- parts/41-calendar.js ---- */
/* ===== Calendar ===== */
const SLOT_H = 20; // px per 15 minutes (matches --slot-h)
const isMobile = () => matchMedia('(max-width: 860px)').matches;

function gridRange(date, staffList) {
  const hrs = staffList.map((s) => s.days[dow(date)]).filter(Boolean);
  let lo = hrs.length ? Math.min(...hrs.map((h) => h[0])) : 540, hi = hrs.length ? Math.max(...hrs.map((h) => h[1])) : 1020;
  const appts = apptsOn(date); for (const a of appts) { lo = Math.min(lo, a.start); hi = Math.max(hi, a.start + a.dur); }
  lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60;
  return [lo, hi];
}
function calStaffColumns() {
  const all = bookableStaff(); const date = S.ui.date;
  if (S.ui.calStaff !== 'all') return all.filter((s) => s.id === S.ui.calStaff);
  if (isMobile()) { const w = all.find((s) => s.days[dow(date)]) || all[0]; return [w]; }
  const working = all.filter((s) => s.days[dow(date)] || apptsOn(date, s.id).length);
  return working.length ? working : all;
}
function daySummary(date) {
  const appts = apptsOn(date).filter((a) => a.status !== 'noshow');
  const booked = sum(appts, (a) => sum(a.items, (i) => i.price));
  const open = bookableStaff().filter((s) => s.days[dow(date)]).reduce((n, s) => n + freeSlots(s.id, date, 60, 30).length, 0);
  return `${appts.length} appointments · ${money(booked, { whole: true })} on the books · ${open} open hour slots`;
}
function apptBlock(a, gridStart, compact = false, lane = 0, lanes = 1) {
  const c = clientById(a.clientId); const cat = apptMainCat(a);
  const top = (a.start - gridStart) / 15 * SLOT_H; const height = Math.max(a.dur / 15 * SLOT_H - 2, 11);
  const short = a.dur <= 30; const micro = a.dur <= 15;
  const laneStyle = lanes > 1 ? `left:calc(${(lane / lanes) * 100}% + 3px);right:calc(${((lanes - lane - 1) / lanes) * 100}% + 3px);` : '';
  return `<div class="appt ${compact ? 'week-appt' : ''} status-${a.status} ${short ? 'short' : ''} ${micro ? 'micro' : ''}" data-act="open-appt" data-id="${a.id}" data-appt data-start="${a.start}" data-dur="${a.dur}" style="top:${top}px;height:${height}px;--cat:${CATEGORIES[cat].color};${laneStyle}" title="${esc(fullName(c))} · ${esc(apptTitle(a))}">
    <div class="t"><span class="ellipsis">${compact ? '' : fmtTime(a.start) + ' · '}${esc(fullName(c))}</span></div>
    <div class="s ellipsis">${esc(apptTitle(a))} · ${fmtDur(a.dur)}${a.source === 'online' ? ' · online' : ''}</div>
    <span class="st ${a.status}"></span></div>`;
}
function withLanes(appts) {
  // assign overlapping appointments to side-by-side lanes
  const sorted = appts.slice().sort(by((a) => a.start)); const out = [];
  let cluster = [], clusterEnd = -1;
  const flush = () => { if (!cluster.length) return; const lanes = []; for (const a of cluster) { let li = lanes.findIndex((end) => end <= a.start); if (li < 0) { li = lanes.length; lanes.push(0); } lanes[li] = a.start + a.dur; out.push({ a, lane: li, lanes: 0 }); } const n = lanes.length; out.slice(out.length - cluster.length).forEach((o) => (o.lanes = n)); cluster = []; };
  for (const a of sorted) { if (a.start >= clusterEnd) { flush(); clusterEnd = a.start + a.dur; } else clusterEnd = Math.max(clusterEnd, a.start + a.dur); cluster.push(a); }
  flush(); return out;
}
function timeAxis(lo, hi) { let s = ''; for (let t = lo; t < hi; t += 60) s += `<div class="cal-time">${fmtTime(t)}</div>`; return s; }

function dayGrid() {
  const date = S.ui.date; const cols = calStaffColumns(); const [lo, hi] = gridRange(date, cols); const H = (hi - lo) / 15 * SLOT_H;
  const closed = !bookableStaff().some((s) => s.days[dow(date)]);
  let html = `<div class="cal-grid" style="--cols:${cols.length}">`;
  html += `<div class="cal-head corner"></div>`;
  for (const s of cols) { const hrs = s.days[dow(date)]; const n = apptsOn(date, s.id).length; html += `<div class="cal-head"><div class="avatar sm" style="background:${s.color}">${initials(s.name)}</div><div class="grow"><div class="who ellipsis">${esc(s.name.split(' ')[0])}</div><div class="meta">${hrs ? `${fmtTime(hrs[0])}–${fmtTime(hrs[1])} · ${n} booked` : 'Off today'}</div></div></div>`; }
  html += `<div class="cal-times" style="height:${H}px">${timeAxis(lo, hi)}</div>`;
  for (const s of cols) {
    const hrs = s.days[dow(date)];
    html += `<div class="cal-col ${hrs ? '' : 'off'}" data-col data-staff="${s.id}" style="height:${H}px">`;
    if (hrs) { if (hrs[0] > lo) html += `<div class="off-band" style="top:0;height:${(hrs[0] - lo) / 15 * SLOT_H}px"></div>`; if (hrs[1] < hi) html += `<div class="off-band" style="top:${(hrs[1] - lo) / 15 * SLOT_H}px;bottom:0"></div>`; }
    for (let t = lo; t < hi; t += 15) html += `<div class="cal-slot" data-act="slot" data-staff="${s.id}" data-min="${t}" style="top:${(t - lo) / 15 * SLOT_H}px" title="Book ${fmtTime(t)}"></div>`;
    for (const { a, lane, lanes } of withLanes(apptsOn(date, s.id))) html += apptBlock(a, lo, false, lane, lanes);
    if (date === todayStr() && nowMin() >= lo && nowMin() <= hi) html += `<div class="now-line" data-now style="top:${(nowMin() - lo) / 15 * SLOT_H}px"></div>`;
    html += `</div>`;
  }
  html += `</div>`;
  if (closed) html = `<div class="alert info" style="margin:12px 18px 0">${I.info}<div><b>Studio closed ${fmtDate(date, 'dow')}.</b> Nobody is scheduled. You can still drop a booking on the grid if someone comes in.</div></div>` + html;
  return `<div class="cal-scroll" id="cal-scroll">${html}</div>`;
}
function weekGrid() {
  const start = startOfWeek(S.ui.date); const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const staff = staffById(S.ui.weekStaff) || bookableStaff()[0];
  let lo = 540, hi = 1080; for (const d of days) { const hrs = staff.days[dow(d)]; if (hrs) { lo = Math.min(lo, hrs[0]); hi = Math.max(hi, hrs[1]); } for (const a of apptsOn(d, staff.id)) { lo = Math.min(lo, a.start); hi = Math.max(hi, a.start + a.dur); } }
  lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60; const H = (hi - lo) / 15 * SLOT_H;
  let html = `<div class="cal-grid week"><div class="cal-head corner"></div>`;
  for (const d of days) { const n = apptsOn(d, staff.id).length; html += `<div class="cal-head ${d === todayStr() ? 'today-col' : ''}" style="cursor:pointer" data-act="cal-goto-day" data-date="${d}"><div class="daynum">${fromDateStr(d).getDate()}</div><div><div class="who">${DOW[dow(d)]}</div><div class="meta">${staff.days[dow(d)] ? `${n} booked` : 'Off'}</div></div></div>`; }
  html += `<div class="cal-times" style="height:${H}px">${timeAxis(lo, hi)}</div>`;
  for (const d of days) {
    const hrs = staff.days[dow(d)];
    html += `<div class="cal-col ${hrs ? '' : 'off'}" data-col data-staff="${staff.id}" data-date="${d}" style="height:${H}px">`;
    if (hrs) { if (hrs[0] > lo) html += `<div class="off-band" style="top:0;height:${(hrs[0] - lo) / 15 * SLOT_H}px"></div>`; if (hrs[1] < hi) html += `<div class="off-band" style="top:${(hrs[1] - lo) / 15 * SLOT_H}px;bottom:0"></div>`; }
    for (let t = lo; t < hi; t += 15) html += `<div class="cal-slot" data-act="slot" data-staff="${staff.id}" data-date="${d}" data-min="${t}" style="top:${(t - lo) / 15 * SLOT_H}px"></div>`;
    for (const { a, lane, lanes } of withLanes(apptsOn(d, staff.id))) html += apptBlock(a, lo, true, lane, lanes);
    if (d === todayStr() && nowMin() >= lo && nowMin() <= hi) html += `<div class="now-line" data-now style="top:${(nowMin() - lo) / 15 * SLOT_H}px"></div>`;
    html += `</div>`;
  }
  return `<div class="cal-scroll" id="cal-scroll">${html}</div>`;
}
function agendaList() {

/* ---- drag to reschedule ---- */
let suppressClickUntil = 0;
function bindDrag(scroll) {
  let drag = null;
  scroll.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('[data-appt]'); if (!el || e.button !== 0) return;
    const a = apptById(el.dataset.id); if (!a || ['completed', 'cancelled', 'noshow'].includes(a.status)) return;
    drag = { el, a, x0: e.clientX, y0: e.clientY, moved: false, col: el.parentElement, top0: parseFloat(el.style.top) };
    el.setPointerCapture(e.pointerId);
  });
  scroll.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    if (!drag.moved) { drag.moved = true; drag.el.classList.add('dragging'); }
    const snapped = Math.round(dy / SLOT_H) * SLOT_H;
    drag.el.style.transform = `translate(${dx}px, ${snapped}px)`;
    // highlight target column
    const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-col]');
    $$('[data-col]', scroll).forEach((c) => (c.style.background = ''));
    if (under && under !== drag.col) under.style.background = 'var(--accent-soft)';
    drag.target = under;
  });
  const finish = (e) => {
    if (!drag) return;
    const d = drag; drag = null; d.el.classList.remove('dragging'); $$('[data-col]', scroll).forEach((c) => (c.style.background = ''));
    if (!d.moved) return;
    suppressClickUntil = Date.now() + 300;
    const col = d.target || d.col; const dy = e.clientY - d.y0; const snapped = Math.round(dy / SLOT_H) * SLOT_H;
    const newTop = d.top0 + snapped; const gridStart = gridStartOf(col);
    const newStart = clamp(gridStart + Math.round(newTop / SLOT_H) * 15, 0, 24 * 60 - 15);
    const res = moveAppointment(d.a.id, { start: newStart, staffId: col.dataset.staff, date: col.dataset.date || d.a.date });
    if (!res.ok) { d.el.style.transform = ''; toast(res.reason, 'bad'); return; }
    rerenderContent(); toast(`Moved to ${fmtTime(newStart)}${col.dataset.staff !== d.a.staffId ? ` with ${staffById(col.dataset.staff).name.split(' ')[0]}` : ''}`, 'good', { label: 'Undo', act: 'undo-move', attrs: `data-id="${d.a.id}" data-start="${d.a.start}" data-staff="${d.a.staffId}" data-date="${d.a.date}"` });
  };
  scroll.addEventListener('pointerup', finish); scroll.addEventListener('pointercancel', finish);
}
function gridStartOf(col) { const t = $('.cal-time', col.closest('.cal-grid')); if (!t) return 540; const txt = t.textContent.trim(); const m = txt.match(/(\d+)(?::(\d+))?(am|pm)/); let hh = parseInt(m[1], 10) % 12 + (m[3] === 'pm' ? 12 : 0); return hh * 60 + (m[2] ? parseInt(m[2], 10) : 0); }

function contraHtml(c, serviceIds) {
  const rs = contraindications(c, serviceIds); if (!rs.length) return '';
  return `<div class="col" style="gap:6px">${rs.map((r) => `<div class="alert ${r.level}">${I.warn}<div>${r.services.length ? `<b>${esc(r.services.join(', '))}:</b> ` : ''}${esc(r.text)}</div></div>`).join('')}</div>`;

function newTicket({ appointmentId = null, clientId }) {
  const a = appointmentId ? apptById(appointmentId) : null; const c = clientById(clientId);
  const plan = c.membershipId && c.memberStatus === 'active' ? planById(c.membershipId) : null;
  const month = todayStr().slice(0, 7);
  const usedVisit = plan ? st().tickets.some((t) => t.clientId === c.id && t.date.slice(0, 7) === month && t.lines.some((l) => l.note && l.note.includes('visit'))) : true;
  let visitApplied = false;
  const lines = (a ? a.items : []).map((it) => {
    const s = svcById(it.serviceId); let price = it.price, note = '';
    if (plan && !visitApplied && plan.includes.includes(s.id) && !usedVisit) { price = 0; note = `${plan.name} visit`; visitApplied = true; }
    else if (plan && s.addon) { price = Math.min(price, 15); note = 'Member add-on'; }
    return { id: uid('l'), type: 'service', refId: s.id, name: s.name, price, listPrice: it.price, qty: 1, staffId: a.staffId, note };
  });
  return { appointmentId, clientId, staffId: a ? a.staffId : st().staff[0].id, lines, discount: { type: 'none', value: 0 }, tipPct: null, tip: 0, payments: [], plan };
}
function ticketTotals(t) {
  const svc = sum(t.lines.filter((l) => l.type === 'service'), (l) => l.price * l.qty);
  const retail = sum(t.lines.filter((l) => l.type === 'product' || l.type === 'gift'), (l) => l.price * l.qty);
  const taxable = sum(t.lines.filter((l) => l.type === 'product'), (l) => l.price * l.qty);
  const r2 = (n) => Math.round(n * 100) / 100;
  const disc = t.discount.type === 'pct' ? r2((svc + retail) * t.discount.value / 100) : t.discount.type === 'amt' ? Math.min(t.discount.value, svc + retail) : 0;
  const tax = r2(taxable * st().business.taxRate);
  const tipBase = Math.max(svc, sum(t.lines.filter((l) => l.type === 'service'), (l) => (l.listPrice || l.price) * l.qty));
  const tip = t.tipPct !== null ? r2(tipBase * t.tipPct / 100) : r2(t.tip || 0);
  const paid = sum(t.payments, (p) => p.amount);
  const total = r2(svc + retail - disc + tax + tip);
  return { svc, retail, disc, tax, tip, tipBase, total, paid, due: r2(total - paid) };
}

/* ===== Import clients from a CSV export (Boulevard, GlossGenius, Vagaro, Square, Mindbody, a spreadsheet) =====
   Columns are recognized by name, every guess can be changed before importing, and nothing is duplicated:
   a row whose phone or email matches an existing client with the same first name is skipped. Notes and allergy
   columns become notes on the client (allergies as caution notes). In a live business the imports sync like any edit. */

const IMPORT_FIELDS = [
  ['first', 'First name', ['first name', 'first', 'firstname', 'given name', 'client first name', 'customer first name']],
  ['last', 'Last name', ['last name', 'last', 'lastname', 'surname', 'family name', 'client last name', 'customer last name']],
  ['name', 'Full name', ['name', 'full name', 'client name', 'client', 'customer name', 'customer', 'contact name']],
  ['phone', 'Mobile phone', ['mobile phone', 'mobile', 'cell', 'cell phone', 'mobile number', 'phone', 'phone number', 'primary phone', 'home phone', 'telephone', 'sms phone']],
  ['email', 'Email', ['email', 'email address', 'e-mail', 'e-mail address', 'primary email']],
  ['dob', 'Birthday', ['birthday', 'birth date', 'date of birth', 'dob', 'birthdate']],
  ['since', 'Client since', ['created at', 'created', 'customer since', 'client since', 'date added', 'join date', 'first visit', 'first visit date', 'signup date']],
  ['lastVisit', 'Last visit', ['last visit', 'last visit date', 'last appointment', 'last appointment date', 'last booked']],
  ['visits', 'Visits', ['visits', 'total visits', 'number of visits', 'visit count', 'appointments', 'total appointments', 'appointment count']],
  ['spend', 'Total spend', ['total spend', 'total spent', 'lifetime value', 'lifetime spend', 'total sales', 'revenue', 'total revenue', 'sales']],
  ['notes', 'Notes', ['notes', 'client notes', 'note', 'comments', 'alerts', 'client alert', 'profile notes']],
  ['allergies', 'Allergies', ['allergies', 'allergy', 'sensitivities']],
  ['tags', 'Tags', ['tags', 'labels', 'groups', 'client tags']],
  ['marketing', 'Marketing OK', ['email marketing', 'marketing opt in', 'accepts marketing', 'marketing', 'email opt in', 'sms marketing', 'opted in']],

// RFC 4180-ish CSV: quotes, doubled quotes, commas/newlines inside quotes, CRLF, BOM, tab- or semicolon-separated files
function parseCsv(text) {
  text = String(text).replace(/^﻿/, '');

function importPlan(rows, map) {
  const get = (r, k) => (map[k] !== undefined && map[k] !== '' ? String(r[map[k]] ?? '').trim() : '');
  const existing = st().clients;
  const key = (first, phone, email) => [first.toLowerCase(), phone, email.toLowerCase()];
  const seen = []; const out = { add: [], dupes: 0, blank: 0 };
  for (const r of rows) {
    let first = get(r, 'first'), last = get(r, 'last');
    if (!first && !last && get(r, 'name')) { const parts = get(r, 'name').split(/\s+/); if (/,/.test(get(r, 'name'))) { const [l, f] = get(r, 'name').split(',').map((x) => x.trim()); first = f || ''; last = l || ''; } else { first = parts.shift() || ''; last = parts.join(' '); } }
    first = first.replace(/\s+/g, ' '); last = last.replace(/\s+/g, ' ');
    if (!first && !last) { out.blank++; continue; }
    if (!first) { first = last; last = ''; }
    let phone = get(r, 'phone').replace(/\D/g, ''); if (phone.length === 11 && phone[0] === '1') phone = phone.slice(1);
    const email = get(r, 'email').toLowerCase();
    const [kf, kp, ke] = key(first, phone, email);
    const clash = (c) => c.first.toLowerCase() === kf && ((kp && c.phone === kp) || (ke && (c.email || '').toLowerCase() === ke));
    if (existing.some(clash) || seen.some((x) => x.first.toLowerCase() === kf && ((kp && x.phone === kp) || (ke && x.email === ke)))) { out.dupes++; continue; }
    const c = { first, last, phone, email, dob: parseLooseDate(get(r, 'dob'), { birthday: true }), createdAt: parseLooseDate(get(r, 'since')) || todayStr(),
      lastVisit: parseLooseDate(get(r, 'lastVisit')), priorVisits: Math.round(moneyNum(get(r, 'visits'))), priorSpend: Math.round(moneyNum(get(r, 'spend'))),
      tags: get(r, 'tags') ? get(r, 'tags').split(/[;,|]/).map((t) => t.trim().toLowerCase()).filter(Boolean) : [], marketing: truthy(get(r, 'marketing')),
      notes: get(r, 'notes'), allergies: get(r, 'allergies') };
    seen.push(c); out.add.push(c);
  }

}

function runImport(plan, source) {
  let n = 0;
  for (const x of plan.add) {
    const c = upsertClient({ first: x.first, last: x.last, phone: x.phone, email: x.email, dob: x.dob, source: `Imported from ${source}`, createdAt: x.createdAt,
      priorVisits: x.priorVisits, priorSpend: x.priorSpend, vip: x.tags.includes('vip'), tags: x.tags, freq: 2, marketingOptIn: x.marketing, importedLastVisit: x.lastVisit || null });
    if (x.notes) addNote(c.id, { type: 'general', text: `From ${source}: ${x.notes}`, staffId: null });
    if (x.allergies && !/^(none|no|n\/a|na|-)$/i.test(x.allergies)) { addNote(c.id, { type: 'caution', text: `Allergies (from ${source}): ${x.allergies}`, staffId: null }); if (!c.flags.includes('allergy')) { c.flags = [...c.flags, 'allergy']; c.allergies = [...(c.allergies || []), x.allergies]; } }

  }

}

// print-ready PNG: the code alone, or a 5×7 sign (1500×2100) with the studio's name and link, centred on the page
function qrCanvas(q, sign) {
  const n = q.getModuleCount();
  const cell = sign ? Math.floor(900 / n) : 24; const code = n * cell; const quiet = 4 * cell;
  const W = sign ? 1500 : code + quiet * 2, H = sign ? 2100 : code + quiet * 2;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  let top = quiet;
  if (sign) {
    const block = 120 + 150 + 110 + code + 150;   // name, line, gap, code, link
    const y = Math.round((H - block) / 2); top = y + 120 + 150 + 110 - 40;
    g.textAlign = 'center'; g.fillStyle = '#1B2224';
    g.font = '400 112px "Instrument Serif", Georgia, serif'; g.fillText(st().business.name, W / 2, y + 100, W - 160);
    g.font = '600 64px "Instrument Sans", system-ui, sans-serif'; g.fillText('Scan to book your next visit', W / 2, y + 250, W - 160);
    g.font = '500 44px "Instrument Sans", system-ui, sans-serif'; g.fillStyle = '#566068'; g.fillText(shortLink(st().live.slug), W / 2, top + code + 120, W - 160);
  }
  const x0 = Math.round((W - code) / 2);
  g.fillStyle = '#111'; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect(x0 + c * cell, top + r * cell, cell, cell);
  return cv;
}

/* ===== Hand-off: a live business sends texts and emails from the studio's own phone (until Luster texting is connected) ===== */
// Texting from Luster needs a registered business number, and carriers want the business's EIN for that. Until it's
// connected, Luster never pretends: it writes the message, opens it in Messages or Mail ready to send, and logs it on
// the client's file as handed off. The demo keeps its pretend carrier.
const simulatedCarrier = () => !isLive();
const isAppleTouch = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function smsHref(phone, body) { const d = String(phone || '').replace(/\D/g, ''); const to = d.length === 10 ? `+1${d}` : d ? `+${d}` : ''; return `sms:${to}${isAppleTouch() ? '&' : '?'}body=${encodeURIComponent(body)}`; }
function mailHref(email, subject, body) { return `mailto:${encodeURIComponent(email || '')}?subject=${encodeURIComponent(subject || '')}&body=${encodeURIComponent(body)}`; }
function manageUrl(token) { return `${appBaseUrl()}book/?t=${token}`; }
// copy inside the tap itself (works on iPad Safari), with the async clipboard as a second try; never blocks
function copyText(text, box) {
  let ok = false;
  if (box) { try { box.focus(); box.select(); ok = document.execCommand('copy'); } catch (e) { ok = false; } }

document.addEventListener('toggle', (e) => { const d = e.target; if (!d || !d.matches || !d.matches('details[data-more]')) return; S.ui.staffMore = S.ui.staffMore || {}; S.ui.staffMore[d.dataset.more] = d.open; }, true);
function staffHoursEditor(s) {
  // dropdowns rather than time boxes: they always read "5pm", even in a narrow card. 15-minute steps, 5am to midnight,
  // plus whatever odd value an import or an older version left behind, so the box never lies about the saved time.
  const opts = (sel) => { const vals = []; for (let m = 300; m <= 1440; m += 15) vals.push(m); if (!vals.includes(sel)) { vals.push(sel); vals.sort((a, b) => a - b); }
    return vals.map((m) => `<option value="${m}" ${m === sel ? 'selected' : ''}>${m === 1440 ? 'midnight' : fmtTime(m)}</option>`).join(''); };
  const cell = 'min-height:30px;padding:3px 22px 3px 6px;min-width:0;font-size:12.5px;background-position:right 6px center';
  return `<details class="staff-more" data-more="${s.id}:hours" style="margin-top:10px" ${moreOpen(s.id, 'hours')}><summary class="small strong">Hours</summary><div class="col" style="gap:6px;margin-top:8px">${[1, 2, 3, 4, 5, 6, 0].map((d) => { const h = s.days[d]; return `<div style="display:grid;grid-template-columns:32px minmax(0,1fr) 8px minmax(0,1fr);gap:4px;align-items:center"><span class="small">${DOW[d]}</span>${h ? `<select class="select" data-on-change="staff-hours" data-id="${s.id}" data-d="${d}" data-end="0" aria-label="${DOW[d]} start" style="${cell}">${opts(h[0])}</select><span class="faint">–</span><select class="select" data-on-change="staff-hours" data-id="${s.id}" data-d="${d}" data-end="1" aria-label="${DOW[d]} end" style="${cell}">${opts(h[1])}</select>` : '<span class="small faint" style="grid-column:span 3">Off</span>'}</div>`; }).join('')}</div></details>`;
}
function staffSkillsEditor(s) {
  const svcs = st().services.filter((v) => !v.internal && !v.retired); const does = (v) => !s.skills || s.skills.includes(v.id);
  const n = svcs.filter(does).length; const groups = groupBy(svcs, (v) => v.cat);
  return `<details class="staff-more" data-more="${s.id}:svc" style="margin-top:6px" ${moreOpen(s.id, 'svc')}><summary class="small strong">Services <span class="faint">· ${n === svcs.length ? 'all' : `${n} of ${svcs.length}`}</span></summary><div class="col" style="gap:2px;margin-top:6px">${CAT_ORDER.filter((k) => groups[k]).map((k) => `<div class="tiny faint" style="margin-top:6px">${esc(CATEGORIES[k].label)}</div>${groups[k].map((v) => `<label class="check" style="padding:2px 0"><input type="checkbox" ${does(v) ? 'checked' : ''} data-on-change="staff-skill" data-id="${s.id}" data-svc="${v.id}"><span class="small">${esc(v.name)}</span></label>`).join('')}`).join('')}</div></details>`;
}
Object.assign(Actions, {
  'change:staff-hours': (el) => {
    const s = staffById(el.dataset.id); const d = +el.dataset.d; const v = parseInt(el.value, 10); if (!isFinite(v) || !s.days[d]) return;
    const h = s.days[d].slice(); h[+el.dataset.end] = v;
    if (h[1] <= h[0]) { toast('End time has to be after the start time', 'bad'); return rerenderContent(); }
    s.days[d] = h; commit(); toast(`${esc(s.name.split(' ')[0])}: ${DOW[d]} ${fmtTime(h[0])}–${fmtTime(h[1])}`);
  },
  'change:staff-skill': (el) => {
    const s = staffById(el.dataset.id); const all = st().services.filter((v) => !v.internal && !v.retired).map((v) => v.id);
    const cur = new Set(s.skills || all); if (el.checked) cur.add(el.dataset.svc); else cur.delete(el.dataset.svc);
    s.skills = all.every((id) => cur.has(id)) ? undefined : all.filter((id) => cur.has(id)); commit(); rerenderContent();
  },
});
Object.assign(Actions, {
  'settings-tab': (el) => { S.ui.settingsTab = el.dataset.id; rerenderContent(); },
  'staff-color': (el) => { staffById(el.dataset.id).color = el.dataset.c; commit(); rerenderContent(); },
  'staff-day': (el) => { const s = staffById(el.dataset.id); const d = +el.dataset.d; if (s.days[d]) delete s.days[d]; else s.days[d] = st().business.hours[d] ? st().business.hours[d].slice() : [540, 1020]; commit(); rerenderContent(); },
  'export-json': () => { const txt = JSON.stringify(st(), null, 1); saveFile(`${exportBase()}-backup-${todayStr()}.json`, txt, 'application/json'); },
  'export-csv': (el) => { const k = el.dataset.k; const rows = k === 'clients' ? clientsCsvRows() : apptsCsvRows(); saveFile(`${exportBase()}-${k}-${todayStr()}.csv`, toCsv(rows), 'text/csv'); toast(`${rows.length - 1} ${k === 'clients' ? 'clients' : tpl().noun.visits} exported`); },
  'change:biz': (el) => { const k = el.dataset.k; st().business[k] = k === 'taxRate' ? (parseFloat(el.value) || 0) / 100 : el.value; commit(); renderRail(); toast('Saved'); },
  'change:staff': (el) => { const s = staffById(el.dataset.id); const k = el.dataset.k; s[k] = k === 'bookable' ? el.checked : el.value; commit(); toast('Saved'); },
  'change:svc': (el) => { const s = svcById(el.dataset.id); const k = el.dataset.k; if (k === 'online') s.hidden = !el.checked; else if (k === 'name') s.name = el.value; else s[k] = Math.max(0, parseFloat(el.value) || 0); commit(); toast('Saved'); },
  'change:prod': (el) => { const p = prodById(el.dataset.id); p[el.dataset.k] = Math.max(0, parseFloat(el.value) || 0); commit(); toast('Saved'); },
  'change:bkset': (el) => { const k = el.dataset.k; st().settings.booking[k] = k === 'depositRequired' ? el.checked : (parseInt(el.value, 10) || 0); commit(); toast('Saved'); },
});

/* ---- parts/50-app.js ---- */
/* ===== Boot ===== */
(async function boot() {
  if (!applySetupLink()) await loadState();   // a setup link may have just created and selected the business itself
  S.ui = defaultUI();
  App.render();
  installHint();
  Cloud.handleAuthRedirect();   // a reset or confirmation link from email
  if (isLive()) Cloud.start();
  // leaving the app (home button, app switcher, lock screen): write this device's copy now and push what's waiting,
  // rather than trusting a timer that iOS may never let run
  const flush = () => { saveNow().catch(() => {}); if (isLive() && Cloud.user) Cloud.sync().catch(() => {}); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); else if (isLive() && Cloud.user) Cloud.sync().catch(() => {}); });
  window.addEventListener('pagehide', flush);
  // the clock: keep today's seeded appointments honest and move the now-line
  setInterval(() => {
    refreshTodayStatuses();
    if (S.ui.view === 'calendar' && S.ui.calMode !== 'agenda') {
      const line = $('[data-now]'); if (line) { const col = line.parentElement; const lo = gridStartOf(col); line.style.top = `${(nowMin() - lo) / 15 * SLOT_H}px`; }
    }
    if (!isLive() && todayStr() !== st().seedDay) { refreshSeededActivity(st()); refreshTodayStatuses(); commit(); App.render(); }
  }, 60000);
  // tell the artifact host how to keep state across republishes
  try { window.claude?.hot?.snapshot?.(() => ({ ui: S.ui })); } catch (e) {}
  window.Luster = { get state() { return S.state; }, get ui() { return S.ui; }, App, Actions, Views, TEMPLATES, Cloud, go: (v) => App.go(v), reset: resetDemo, createWorkspace, switchWorkspace, workspaces, save: () => saveNow() };
})();

</script>
